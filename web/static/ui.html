<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NROD RailHub - Schematic Visualization PoC</title>
    <link rel="stylesheet" href="/static/ui.css" />
</head>
<body>
    <div class="container noselect">
        <h1>🚂 NROD RailHub - Schematic Visualization PoC</h1>
        
        <div class="status noselect">

            <div>
                <div>
                    <span class="status-indicator" id="wsStatus"></span>
                    <span id="wsStatusText">Connecting...</span>
                    <span id="layoutInfo" role="status" aria-live="polite">Loading layout...</span>
                </div>
                <div class="controls">
                    <label for="layoutSelect">Layout:</label>
                    <select id="layoutSelect" aria-label="Select layout" disabled></select>
                </div>
            </div>

            <div class="zoom-controls" role="group" aria-label="Schematic zoom">
                <button type="button" id="zoomOut" aria-label="Zoom out">&minus;</button>
                <span id="zoomLevel" aria-live="polite">100%</span>
                <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
                <button type="button" id="zoomFit">Fit all</button>
                <button type="button" id="zoomReset">Reset view</button>
                <span style="font-size:12px;color:#aaa">Scroll to pan &middot; Ctrl/&#8984; + scroll or pinch to zoom &middot; drag to pan</span>
            </div>
        </div>


        <div class="schematic-container noselect">
            <svg class="noselect" id="schematic" width="100%" height="100%"></svg>
        </div>
        
        <div class="legend">
            <h3>Legend</h3>
            <div class="legend-items">
                <div class="legend-item">
                    <div class="legend-box empty"></div>
                    <span>Empty Berth</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box occupied"></div>
                    <span>Occupied Berth</span>
                </div>
                <div class="legend-item">
                    <div class="legend-circle train"></div>
                    <span>Train Position</span>
                </div>
            </div>
        </div>
        
        <div class="event-log">
            <h3>Event Log</h3>
            <div id="eventLog"></div>
        </div>
    </div>
    
    <script defer src="/static/track-routing.js"></script>
    <script defer src="/static/ui.js"></script>
</body>
</html>
